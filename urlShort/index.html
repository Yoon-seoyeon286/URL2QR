<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL단축</title>
    <style>
      :root{--bg1:#fff8ee;--bg2:#f4f7ff;--bg3:#fff0f6;--text:#203047;--muted:#6d7c90}
      *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text);background:radial-gradient(900px circle at var(--mx,50%) var(--my,20%), rgba(124,124,255,.26), transparent 35%),radial-gradient(700px circle at calc(var(--mx,50%) + 18%) calc(var(--my,20%) + 10%), rgba(255,123,176,.20), transparent 32%),linear-gradient(135deg,var(--bg1),var(--bg2) 48%,var(--bg3));display:grid;place-items:center;padding:24px;overflow-x:hidden}
      .noise{position:fixed;inset:0;pointer-events:none;opacity:.04;background-image:radial-gradient(#203047 .7px, transparent .7px);background-size:18px 18px}
      .panel{width:min(760px,100%);background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.72);backdrop-filter:blur(18px);border-radius:32px;box-shadow:0 22px 60px rgba(56,76,110,.12);padding:26px;position:relative;z-index:1}
      .top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.back{color:var(--text);text-decoration:none;font-weight:700}
      h1{margin:0;text-align:center;letter-spacing:-.055em;font-size:clamp(2rem,4vw,3.4rem)} p{margin:12px auto 24px;max-width:44rem;text-align:center;color:var(--muted);line-height:1.65}
      .input-card{background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.7);border-radius:28px;padding:18px;box-shadow:0 18px 40px rgba(56,76,110,.08)}
      .row{display:flex;gap:12px} input{flex:1;border:1px solid rgba(109,124,144,.18);background:#fff;border-radius:18px;padding:16px 18px;font-size:1rem;outline:none} button{border:0;border-radius:18px;padding:15px 20px;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,#7c7cff,#5d9bff 50%,#ff7bb0)} button:disabled{opacity:.45;cursor:not-allowed}
      .result{margin-top:18px;display:grid;gap:12px}.result textarea{width:100%;min-height:110px;border:1px solid rgba(109,124,144,.18);border-radius:18px;padding:16px;background:#fff;resize:none;font-size:.98rem;line-height:1.5}
      .copy-row{display:flex;justify-content:flex-end}.copy{background:linear-gradient(135deg,#36c2a8,#5d9bff)}
      .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#203047;color:#fff;padding:12px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease}.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
      .hint{margin-top:10px;color:var(--muted);font-size:.92rem}
      @media (max-width:700px){.row{flex-direction:column}button{width:100%}}
    </style>
  </head>
  <body>
    <div class="noise"></div>
    <div class="panel">
      <div class="top"><a class="back" href="../index.html">← 뒤로</a><div></div></div>
      <h1>URL단축</h1>
      <p>GitHub Pages에서도 동작하도록, 여러 공개 단축 API를 순차적으로 시도합니다.</p>
      <div class="input-card">
        <div class="row">
          <input id="urlInput" type="url" placeholder="https://example.com" autocomplete="off" />
          <button id="shortenBtn" disabled>단축하기</button>
        </div>
        <div class="result">
          <textarea id="output" readonly placeholder="단축 결과가 여기에 표시됩니다."></textarea>
          <div class="copy-row"><button id="copyBtn" class="copy" disabled>복사</button></div>
          <div class="hint">입력값이 비어 있으면 단축하기 버튼이 비활성화됩니다.</div>
        </div>
      </div>
    </div>
    <div id="toast" class="toast">복사하였습니다</div>
    <script>
      const urlInput=document.getElementById('urlInput'),shortenBtn=document.getElementById('shortenBtn'),output=document.getElementById('output'),copyBtn=document.getElementById('copyBtn'),toast=document.getElementById('toast');
      const sanitize=v=>{const t=v.trim();if(!t)return'';return /^https?:\/\//i.test(t)?t:'https://'+t};
      const toggle=()=>{shortenBtn.disabled=!urlInput.value.trim()};
      const showToast=()=>{toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1300)};
      urlInput.addEventListener('input',()=>{toggle();copyBtn.disabled=!output.value.trim()});
      async function tryApis(url){
        const apis=[
          async()=>{const res=await fetch('https://tinyurl.com/api-create.php?url='+encodeURIComponent(url),{method:'GET'});const t=(await res.text()).trim();if(!t||t.toLowerCase().includes('error')) throw new Error('tinyurl');return t;},
          async()=>{const res=await fetch('https://is.gd/create.php?format=simple&url='+encodeURIComponent(url),{method:'GET'});const t=(await res.text()).trim();if(!t||t.toLowerCase().includes('error')) throw new Error('isgd');return t;},
          async()=>{const res=await fetch('https://shorturl.at/api?url='+encodeURIComponent(url),{method:'GET'});const t=(await res.text()).trim();if(!t||t.toLowerCase().includes('error')) throw new Error('shorturl');return t;}
        ];
        let lastError=null;
        for(const api of apis){try{return await api();}catch(e){lastError=e;}}
        throw lastError || new Error('all failed');
      }

      shortenBtn.addEventListener('click',async()=>{const url=sanitize(urlInput.value);if(!url)return;output.value='단축 요청 중...';copyBtn.disabled=true;shortenBtn.disabled=true;try{const shortUrl=await tryApis(url);output.value=shortUrl;copyBtn.disabled=false}catch(e){output.value='모든 공개 API가 실패했습니다. GitHub Pages에서는 외부 서비스 정책에 따라 실패할 수 있습니다.';copyBtn.disabled=true}finally{toggle()}});
      copyBtn.addEventListener('click',async()=>{const text=output.value.trim();if(!text)return;await navigator.clipboard.writeText(text);showToast()});
      window.addEventListener('pointermove',e=>{document.body.style.setProperty('--mx',((e.clientX/window.innerWidth)*100)+'%');document.body.style.setProperty('--my',((e.clientY/window.innerHeight)*100)+'%')},{passive:true});
    </script>
  </body>
</html>
