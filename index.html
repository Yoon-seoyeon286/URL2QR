<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL Tools</title>
    <style>
      :root{--bg1:#fff8ee;--bg2:#f4f7ff;--bg3:#fff0f6;--text:#203047;--muted:#6d7c90}
      *{box-sizing:border-box} html,body{height:100%}
      body{margin:0;font-family:Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text);background:radial-gradient(900px circle at var(--mx,50%) var(--my,20%), rgba(124,124,255,.26), transparent 35%),radial-gradient(700px circle at calc(var(--mx,50%) + 18%) calc(var(--my,20%) + 10%), rgba(255,123,176,.20), transparent 32%),linear-gradient(135deg,var(--bg1),var(--bg2) 48%,var(--bg3));overflow:hidden}
      .noise{position:fixed;inset:0;pointer-events:none;opacity:.04;background-image:radial-gradient(#203047 .7px, transparent .7px);background-size:18px 18px}
      .shell{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;z-index:1}
      .panel{width:min(820px,100%);background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.72);backdrop-filter:blur(18px);border-radius:32px;box-shadow:0 22px 60px rgba(56,76,110,.12);padding:28px}
      header{display:flex;align-items:center;gap:14px;margin-bottom:28px}
      .logo-wrap{width:66px;height:66px;overflow:hidden}.logo-wrap img{width:100%;height:100%;object-fit:cover;display:block}
      .brand strong{display:block;font-size:1.2rem;letter-spacing:-.02em}.brand span{display:block;color:var(--muted);font-size:.92rem;letter-spacing:-.01em;margin-top:4px}
      h1{margin:0;text-align:center;letter-spacing:-.055em;font-size:clamp(2rem,4vw,3.3rem)}
      p{margin:14px auto 0;max-width:42rem;text-align:center;color:var(--muted);line-height:1.65}
      .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:30px}
      .card{min-height:170px;border-radius:28px;padding:22px;background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.7);box-shadow:0 18px 40px rgba(56,76,110,.08);display:flex;flex-direction:column;justify-content:space-between}
      .card h2{margin:0 0 10px;font-size:1.15rem;letter-spacing:-.03em}.card span{color:var(--muted);line-height:1.55}
      .actions{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
      .btn{border:0;border-radius:18px;padding:15px 20px;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,#7c7cff,#5d9bff 50%,#ff7bb0);box-shadow:0 14px 28px rgba(124,124,255,.18);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.secondary{background:linear-gradient(135deg,#36c2a8,#5d9bff)}
      .footer{margin-top:18px;text-align:center;color:var(--muted);font-size:.9rem}
      @media (max-width:720px){.grid{grid-template-columns:1fr}.panel{padding:22px}.logo-wrap{width:54px;height:54px}}
    </style>
  </head>
  <body>
    <div class="noise"></div>
    <div class="shell">
      <section class="panel">
        <header>
          <div class="logo-wrap"><img id="logo" alt="logo" /></div>
          <div class="brand"><strong>URL Tools</strong><span>QR코드 생성과 URL 단축</span></div>
        </header>
        <h1>원하는 기능을 선택하세요</h1>
        <p>QR코드 생성과 URL 단축을 각각 분리해 더 깔끔하게 사용할 수 있도록 구성했습니다.</p>
        <div class="grid">
          <div class="card"><div><h2>QR코드</h2><span>URL을 입력해서 QR코드를 만들고 JPG로 저장하는 도구입니다.</span></div><div class="actions"><a class="btn" href="./url2qr/index.html">QR코드</a></div></div>
          <div class="card"><div><h2>URL단축</h2><span>URL을 짧게 줄이고 결과를 복사할 수 있는 도구입니다.</span></div><div class="actions"><a class="btn secondary" href="./urlShort/index.html">URL단축</a></div></div>
        </div>
        <div class="footer">기본 로고는 assets 폴더의 이미지를 자동으로 찾아 표시합니다.</div>
      </section>
    </div>
    <script>
      const logo=document.getElementById('logo');const candidates=['./assets/logo.png','./assets/logo.jpg','./assets/logo.jpeg','./assets/logo.svg','./assets/icon.png','./assets/icon.jpg','./assets/icon.svg'];(async()=>{for(const src of candidates){const ok=await new Promise(r=>{const i=new Image();i.onload=()=>r(true);i.onerror=()=>r(false);i.src=src});if(ok){logo.src=src;break}}})();window.addEventListener('pointermove',e=>{document.body.style.setProperty('--mx',((e.clientX/window.innerWidth)*100)+'%');document.body.style.setProperty('--my',((e.clientY/window.innerHeight)*100)+'%')},{passive:true});
    </script>
  </body>
</html>
